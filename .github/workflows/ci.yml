name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  lint:
    name: Lint (ruff)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v4
        with:
          enable-cache: true

      - name: Set up Python
        run: uv python install 3.11

      - name: Sync dev dependencies
        run: uv sync --extra dev

      - name: ruff check
        run: uv run ruff check .

      - name: ruff format --check
        run: uv run ruff format --check .

  test:
    name: Tests (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4

      - name: Install ffmpeg
        # `cmd_analyze` preflights ffmpeg before opening a Telegram session
        # when voice / video enrichment is enabled (the default). Without
        # this, `cmd_analyze`-touching tests (e.g. test_regressions_deep_review
        # dispatch unit tests with a stubbed tg_client) trip `require_ffmpeg`
        # and exit before reaching the assertions. ffmpeg is a real runtime
        # dep — `doctor` checks for it — so installing it in CI matches the
        # documented install shape rather than papering over the gate.
        run: sudo apt-get update && sudo apt-get install -y ffmpeg

      - name: Install uv
        uses: astral-sh/setup-uv@v4
        with:
          enable-cache: true

      - name: Set up Python ${{ matrix.python-version }}
        run: uv python install ${{ matrix.python-version }}

      - name: Sync dev dependencies
        run: uv sync --extra dev --python ${{ matrix.python-version }}

      - name: Run pytest
        # `uv run` without `--python` re-resolves Python from `requires-python`
        # and recreates `.venv` for the lowest matching version (3.11), wiping
        # out the matrix-pinned 3.12 / 3.13 venv along with the `--extra dev`
        # install — pytest then fails to spawn. Pin the matrix version on the
        # run too so the synced venv survives.
        run: uv run --python ${{ matrix.python-version }} pytest -q

  # Install smoke test. The `test` job runs against uv.lock-pinned deps,
  # but end users get `uv tool install unread` / `pip install unread`,
  # which IGNORE the lock and resolve dependencies fresh from the
  # pyproject ranges. A new release of a loosely-pinned dep (this is how
  # the typer "_UnreadRootGroup has no attribute 'chain'" prod outage
  # happened) only shows up under that fresh resolution. This job
  # reproduces the end-user install in a clean venv and exercises the
  # exact code path that broke: root help + subcommand argument parsing.
  install-smoke:
    name: Install smoke test (clean env, resolved deps)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v4
        with:
          enable-cache: true

      - name: Set up Python
        run: uv python install 3.12

      - name: Install unread into a clean venv (deps resolved from pyproject, not uv.lock)
        run: |
          uv venv --python 3.12 /tmp/smoke
          # `uv pip install .` (no --frozen / no sync) resolves the
          # dependency ranges fresh, exactly like the end-user install.
          uv pip install --python /tmp/smoke/bin/python .

      - name: Show resolved typer / click versions
        run: uv pip show --python /tmp/smoke/bin/python typer click | grep -E "^(Name|Version):"

      - name: Smoke — root + subcommand parsing must not crash
        run: |
          set -e
          # `--help` exits 0; both paths run _PreferSubcommandsGroup
          # .parse_args (the `self.chain` line). A dependency-drift
          # regression turns these into a non-zero AttributeError exit.
          /tmp/smoke/bin/unread --help
          /tmp/smoke/bin/unread tg --help

  # Provider-matrix smoke tests. Pre-prod hardening: the alternative AI
  # adapters (Anthropic, Google) only ran their "dispatch" assertion
  # under the main `test` job; the new provider-specific tests under
  # tests/test_anthropic_adapter.py and tests/test_google_adapter.py
  # are the ones that actually exercise translation / finish-reason /
  # usage / retry. Run them once per provider with the corresponding
  # env var set so a regression in one adapter can't sneak through.
  provider-matrix:
    name: Provider matrix (${{ matrix.provider }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        provider: ["openai", "anthropic", "google"]
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v4
        with:
          enable-cache: true

      - name: Set up Python
        run: uv python install 3.11

      - name: Sync dev dependencies
        run: uv sync --extra dev

      - name: Run provider-specific tests
        env:
          # Pin the active provider so make_chat_provider() routes
          # smoke calls through the matching adapter; the per-adapter
          # test files run their stubs regardless. CI fake keys keep
          # any accidental real-network call from succeeding.
          UNREAD_TEST_PROVIDER: ${{ matrix.provider }}
          OPENAI_API_KEY: "sk-test-fake"
          ANTHROPIC_API_KEY: "sk-ant-test-fake"
          GOOGLE_API_KEY: "AI-test-fake"
        run: |
          # `-k provider_matrix or test_ai_providers or _adapter`
          # selects the adapter dispatch tests + the per-provider
          # adapter suites added in Phase 5 (test_anthropic_adapter,
          # test_google_adapter). Running once per provider catches
          # regressions a single-provider main-job pass would miss.
          uv run pytest -q -k "provider_matrix or test_ai_providers or _adapter"
