name: Release

on:
  workflow_dispatch:

jobs:
  # Gate: never publish a wheel without first proving lint + tests pass on
  # the exact tree we're about to ship. Without this, a red `main` could
  # still ship to PyPI because release is `workflow_dispatch`-only and
  # bypasses CI's `push: main` trigger.
  gate:
    name: Pre-release gate (lint + tests)
    runs-on: ubuntu-latest
    if: github.event_name == 'workflow_dispatch'
    steps:
      - uses: actions/checkout@v4

      - name: Install ffmpeg
        # Matches the test job in ci.yml — `cmd_analyze` preflights ffmpeg
        # for Telegram refs with voice/video enrichment (the default), so
        # the release gate needs a real ffmpeg on PATH to mirror the
        # documented user install shape.
        run: sudo apt-get update && sudo apt-get install -y ffmpeg

      - name: Install uv
        uses: astral-sh/setup-uv@v4
        with:
          enable-cache: true

      - name: Set up Python
        run: uv python install 3.11

      - name: Sync dev dependencies
        run: uv sync --extra dev

      - name: ruff check
        run: uv run ruff check .

      - name: ruff format --check
        run: uv run ruff format --check .

      - name: pytest
        run: uv run pytest -q

  release:
    needs: gate
    runs-on: ubuntu-latest
    if: github.event_name == 'workflow_dispatch'
    permissions:
      contents: write
      issues: write
      pull-requests: write
    outputs:
      new_release_published: ${{ steps.semantic.outputs.new_release_published }}
      new_release_version: ${{ steps.semantic.outputs.new_release_version }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Install semantic-release
        # Majors are PINNED on purpose. These packages are only
        # compatible in matching sets: `@semantic-release/release-notes-
        # generator@14` bundles `conventional-changelog-writer@8`, and
        # `conventional-changelog-conventionalcommits@10` requires
        # writer@9. Installed unpinned, npm happily picked preset v10
        # against writer v8 — which first rendered EMPTY release notes
        # (hence `chore(changelog): backfill empty 1.2.0 release notes`)
        # and then, once the preset added a hard version guard in
        # v10.3.0, failed the whole release with
        # `Missing helper: conventional-changelog-conventionalcommits
        # requires conventional-changelog-writer@9 or newer`.
        # Bump these together, never one at a time, and verify with
        # `npx semantic-release --dry-run --no-ci` before merging.
        run: |
          npm install -g \
            semantic-release@25 \
            @semantic-release/commit-analyzer@13 \
            @semantic-release/release-notes-generator@14 \
            @semantic-release/changelog@7 \
            @semantic-release/exec@7 \
            @semantic-release/git@11 \
            @semantic-release/github@12 \
            conventional-changelog-conventionalcommits@8

      - name: Release
        id: semantic
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # The exec plugin's prepareCmd runs `python scripts/sync_version.py`
          # to bump pyproject.toml + unread/__init__.py; the git plugin
          # then commits those alongside CHANGELOG.md and pushes back to
          # main. Capture the version semantic-release computed for the
          # publish + verify steps below.
          npx semantic-release
          VERSION=$(git describe --tags --abbrev=0 2>/dev/null || echo "")
          if [ -n "$VERSION" ]; then
            echo "new_release_published=true" >> "$GITHUB_OUTPUT"
            echo "new_release_version=${VERSION#v}" >> "$GITHUB_OUTPUT"
          else
            echo "new_release_published=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Setup uv (PyPI publish)
        if: steps.semantic.outputs.new_release_published == 'true'
        uses: astral-sh/setup-uv@v4
        with:
          enable-cache: true

      - name: Build wheel + sdist
        if: steps.semantic.outputs.new_release_published == 'true'
        run: uv build

      - name: Verify wheel includes data files + correct version
        if: steps.semantic.outputs.new_release_published == 'true'
        env:
          NEW_VERSION: ${{ steps.semantic.outputs.new_release_version }}
        run: |
          # Belt-and-braces guard: assert the wheel contains the ship-
          # critical data files (schema.sql + every preset) and that its
          # filename carries the version semantic-release just computed.
          # A mismatch here means the version-sync or hatch include rules
          # silently broke — fail loudly before publishing to PyPI.
          set -euo pipefail
          unzip -l dist/*.whl | grep -E "unread/db/schema\.sql$" \
            || { echo "wheel missing schema.sql"; exit 1; }
          unzip -l dist/*.whl | grep -E "presets/en/summary\.md$" \
            || { echo "wheel missing presets/en/summary.md"; exit 1; }
          python - <<'PY'
          import glob, os, sys
          version = os.environ["NEW_VERSION"]
          wheels = glob.glob("dist/*.whl")
          assert wheels, "no wheel built"
          ok = any(version in w for w in wheels)
          if not ok:
              sys.exit(f"wheel filename {wheels} does not contain {version!r}")
          PY

      - name: Publish to PyPI
        if: steps.semantic.outputs.new_release_published == 'true'
        env:
          UV_PUBLISH_TOKEN: ${{ secrets.PYPI_TOKEN }}
        run: uv publish

  # Publish the versioned + `:latest` Docker image for the release.
  # This CANNOT rely on image.yml's `push: tags v*` trigger: the tag
  # semantic-release creates points at its own `chore(release): … [skip
  # ci]` commit, and GitHub honors `[skip ci]` on the tag push too, so
  # the tag-triggered image build never runs. Building here — gated on a
  # real publish and checked out at the new tag — keeps the Docker image
  # in lockstep with the PyPI release. Mirrors image.yml's tag semantics
  # (`:1.2.3`, `:1.2`, `:latest`).
  docker:
    name: Publish Docker image to GHCR
    needs: release
    if: needs.release.outputs.new_release_published == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: v${{ needs.release.outputs.new_release_version }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Compute image tags
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/unread
          # workflow_dispatch runs on a branch ref, so `type=semver` is
          # given the released version explicitly via `value=`.
          tags: |
            type=semver,pattern={{version}},value=v${{ needs.release.outputs.new_release_version }}
            type=semver,pattern={{major}}.{{minor}},value=v${{ needs.release.outputs.new_release_version }}
            type=raw,value=latest
          labels: |
            org.opencontainers.image.title=unread
            org.opencontainers.image.description=Generic unread CLI runtime — analyze command line + bot in one image
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.licenses=MIT

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          platforms: linux/amd64
