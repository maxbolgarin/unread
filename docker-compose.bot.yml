# The unread Telegram bot as a Docker Compose service. Pulls the prebuilt
# image from GHCR — nothing is built from source.
#
# Easiest: the installer writes this file and its .env for you, starts the
# bot and adds an `unread-bot` command to manage it:
#   curl -fsSL https://raw.githubusercontent.com/maxbolgarin/unread/main/scripts/install-bot-docker.sh | bash
#
# By hand, in an empty directory:
#   curl -fsSLo docker-compose.yml https://raw.githubusercontent.com/maxbolgarin/unread/main/docker-compose.bot.yml
#   curl -fsSLo .env https://raw.githubusercontent.com/maxbolgarin/unread/main/.env.bot.example
#   nano .env                  # fill in the required values
#   docker compose up -d
#   docker compose logs -f     # wait for "✓ bot ready"
#
# Compose reads `.env` from this directory by itself, so plain
# `docker compose <command>` works. (From a repo checkout with `.env.bot`
# instead, pass `-f docker-compose.bot.yml --env-file .env.bot` to EVERY
# command — the required values below are checked on each one.)
#
# Update:  docker compose pull && docker compose up -d
# Guide:   https://github.com/maxbolgarin/unread/blob/main/docs/bot-vm-deploy.md

services:
  unread-bot:
    # Pin a version with UNREAD_BOT_IMAGE (e.g. ghcr.io/maxbolgarin/unread:1.10.0).
    # `:latest` moves on every release; `docker compose pull` fetches it.
    image: "${UNREAD_BOT_IMAGE:-ghcr.io/maxbolgarin/unread:latest}"
    # The image is a generic `unread` runtime; this picks the bot.
    command: ["unread", "bot", "run"]
    restart: unless-stopped
    # Reap ffmpeg / PDF-worker children and hand `docker stop` to the bot
    # right away instead of waiting out the 10 s kill timeout.
    init: true
    environment:
      # --- Required ---------------------------------------------------
      UNREAD_BOT_TOKEN: "${UNREAD_BOT_TOKEN:?UNREAD_BOT_TOKEN is required (see .env.bot.example)}"
      TELEGRAM_API_ID: "${TELEGRAM_API_ID:?TELEGRAM_API_ID is required (see .env.bot.example)}"
      TELEGRAM_API_HASH: "${TELEGRAM_API_HASH:?TELEGRAM_API_HASH is required (see .env.bot.example)}"
      # Who may use the bot: one id, or several separated by commas. Can be
      # left empty only when a Telegram user session is installed.
      UNREAD_BOT_OWNER_ID: "${UNREAD_BOT_OWNER_ID:-}"

      # --- AI: at least one key ---------------------------------------
      OPENAI_API_KEY: "${OPENAI_API_KEY:-}"
      ANTHROPIC_API_KEY: "${ANTHROPIC_API_KEY:-}"
      GOOGLE_API_KEY: "${GOOGLE_API_KEY:-}"
      OPENROUTER_API_KEY: "${OPENROUTER_API_KEY:-}"

      # --- AI routing (optional; unset = openai) -----------------------
      # A value here outranks the bot's /settings menu.
      UNREAD_AI_CHAT_PROVIDER: "${UNREAD_AI_CHAT_PROVIDER:-}"
      UNREAD_AI_CHAT_MODEL: "${UNREAD_AI_CHAT_MODEL:-}"
      UNREAD_AI_FILTER_PROVIDER: "${UNREAD_AI_FILTER_PROVIDER:-}"
      UNREAD_AI_FILTER_MODEL: "${UNREAD_AI_FILTER_MODEL:-}"
      UNREAD_AI_VISION_PROVIDER: "${UNREAD_AI_VISION_PROVIDER:-}"
      UNREAD_AI_VISION_MODEL: "${UNREAD_AI_VISION_MODEL:-}"
      UNREAD_AI_AUDIO_PROVIDER: "${UNREAD_AI_AUDIO_PROVIDER:-}"
      UNREAD_AI_AUDIO_MODEL: "${UNREAD_AI_AUDIO_MODEL:-}"
      # Model list / prices are re-fetched from the repo this often; 0 = off.
      UNREAD_AI_CATALOG_REFRESH_HOURS: "${UNREAD_AI_CATALOG_REFRESH_HOURS:-24}"

      # --- Bot tuning (optional) --------------------------------------
      UNREAD_BOT_CONCURRENCY: "${UNREAD_BOT_CONCURRENCY:-2}"
      UNREAD_BOT_DEFAULT_PRESET: "${UNREAD_BOT_DEFAULT_PRESET:-}"
      UNREAD_BOT_MAX_FILE_MB: "${UNREAD_BOT_MAX_FILE_MB:-100}"
      # "pdf" (default) or "md". Falls back to "md" by itself when the PDF
      # renderer is unavailable.
      UNREAD_BOT_REPORT_FORMAT: "${UNREAD_BOT_REPORT_FORMAT:-pdf}"
    volumes:
      # Reports, cache, settings, secrets and the optional Telegram user
      # session. Survives restarts and image updates.
      - unread_state:/root/.unread
    # Keep container logs from slowly filling a small VM disk.
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  unread_state:
